<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aurora · Windows 11</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --sw: clamp(150px, 20vw, 264px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17171b
    }

    .root {
      position: fixed;
      inset: 0
    }

    .app {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--tx);
      font: 14px/20px "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility
    }

    .app[data-theme=dark] {
      --bg: #272727;
      --sb: #202020;
      --cd: #2d2d2d;
      --tx: #fff;
      --mu: rgba(255, 255, 255, .64);
      --ln: rgba(255, 255, 255, .085);
      --ac: #9ba8ff;
      --ac2: rgba(155, 168, 255, .26);
      --hv: rgba(255, 255, 255, .065);
      --pr: rgba(255, 255, 255, .04);
      --cap: rgba(255, 255, 255, .1)
    }

    .app[data-theme=light] {
      --bg: #fafafa;
      --sb: #f0f0f0;
      --cd: #fff;
      --tx: #1a1a1a;
      --mu: rgba(0, 0, 0, .6);
      --ln: rgba(0, 0, 0, .08);
      --ac: #5b84d6;
      --ac2: rgba(91, 132, 214, .22);
      --hv: rgba(0, 0, 0, .05);
      --pr: rgba(0, 0, 0, .03);
      --cap: rgba(0, 0, 0, .08)
    }

    #appL {
      pointer-events: none;
      will-change: clip-path
    }

    .tb {
      display: flex;
      align-items: center;
      height: 32px;
      padding-top: env(safe-area-inset-top, 0px);
      background: var(--sb);
      font-size: 12px;
      line-height: 16px;
      flex: none;
      app-region: drag;
      -webkit-app-region: drag;
      user-select: none
    }

    .ti {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 12px
    }

    .lg {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      background: var(--ac);
      position: relative
    }

    .lg::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 5px;
      width: 6px;
      height: 6px;
      border-radius: 2px;
      background: var(--bg)
    }

    .cb {
      display: flex;
      margin-left: auto;
      align-self: stretch;
      padding-right: env(safe-area-inset-right, 0px);
      app-region: no-drag;
      -webkit-app-region: no-drag
    }

    .cb span {
      width: 46px;
      height: 100%;
      display: grid;
      place-items: center;
      transition: background .12s
    }

    .cb span:hover {
      background: var(--cap)
    }

    .cb span:active {
      background: var(--pr);
      opacity: .8
    }

    .cb span:last-child:hover {
      background: #c42b1c;
      color: #fff
    }

    .cp {
      width: 10px;
      height: 10px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1
    }

    .bd {
      flex: 1;
      display: flex;
      min-height: 0;
      background: var(--sb)
    }

    .sd {
      width: calc(var(--sw) + env(safe-area-inset-left, 0px));
      flex: none;
      display: flex;
      flex-direction: column;
      padding: 6px 8px 0 calc(8px + env(safe-area-inset-left, 0px));
      box-sizing: border-box
    }

    .nv {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 38px;
      padding: 0 12px;
      margin-bottom: 2px;
      border-radius: 4px;
      color: var(--tx);
      opacity: .78;
      transition: background .15s, opacity .15s, transform .12s cubic-bezier(.1, .9, .2, 1)
    }

    .nv:hover {
      background: var(--hv);
      opacity: 1
    }

    .nv:active {
      background: var(--pr);
      transform: scale(.985)
    }

    .nv.on {
      background: var(--hv);
      opacity: 1
    }

    .nv.on::before {
      content: "";
      position: absolute;
      left: 0;
      top: 11px;
      width: 3px;
      height: 16px;
      border-radius: 2px;
      background: var(--ac);
      animation: pill .32s cubic-bezier(.1, .9, .2, 1) .2s both
    }

    .ic {
      width: 16px;
      height: 16px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .sl {
      margin: auto 8px calc(14px + env(safe-area-inset-bottom, 0px));
      aspect-ratio: 440/230
    }

    .mn {
      flex: 1;
      min-width: 0;
      padding: 24px calc(28px + env(safe-area-inset-right, 0px)) 24px 28px;
      background: var(--bg);
      border-top-left-radius: 8px;
      border-top: 1px solid var(--ln);
      border-left: 1px solid var(--ln)
    }

    .hd {
      display: flex;
      align-items: center;
      gap: 12px
    }

    h1 {
      margin: 0;
      font: 600 24px/32px "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      letter-spacing: -.01em
    }

    .hd p {
      margin: 2px 0 0;
      color: var(--mu)
    }

    .se {
      margin-left: auto;
      width: 220px;
      max-width: 34%;
      height: 32px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border-radius: 4px;
      background: var(--cd);
      border: 1px solid var(--ln);
      border-bottom-color: color-mix(in srgb, var(--tx) 45%, transparent);
      color: var(--mu)
    }

    .gr {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px
    }

    .cd {
      background: var(--cd);
      border: 1px solid var(--ln);
      border-radius: 8px;
      padding: 16px 18px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
      transition: background .15s;
      animation: rise .42s cubic-bezier(.1, .9, .2, 1) both
    }

    .w2 {
      grid-column: span 2
    }

    .k {
      color: var(--mu);
      font-size: 12px
    }

    .v {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -.02em;
      margin: 2px 0
    }

    .dl {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--ac);
      font-size: 12px
    }

    .sp {
      width: 64px;
      height: 20px;
      fill: none;
      stroke: var(--ac);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      animation: dash .9s cubic-bezier(.2, .8, .2, 1) .35s both
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 104px;
      margin-top: 12px
    }

    .bars i {
      flex: 1;
      border-radius: 5px 5px 2px 2px;
      background: var(--ac2);
      transform-origin: 50% 100%;
      animation: grow .6s cubic-bezier(.1, .9, .2, 1) .3s both;
      animation-delay: calc(.25s + sibling-index()*.045s)
    }

    .bars i.on {
      background: var(--ac)
    }

    .dy {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      color: var(--mu);
      font-size: 11px
    }

    .dy span {
      flex: 1;
      text-align: center
    }

    .fl {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--ln)
    }

    .fl:first-of-type {
      border-top: 0
    }

    .fl b {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ac)
    }

    .fl em {
      margin-left: auto;
      font-style: normal;
      color: var(--mu);
      font-size: 12px;
      white-space: nowrap
    }

    .fl span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    @media(max-width:760px) {
      .gr {
        grid-template-columns: 1fr 1fr
      }

      .se {
        display: none
      }
    }

    @media(max-width:520px) {
      .gr {
        grid-template-columns: 1fr
      }

      .w2 {
        grid-column: auto
      }

      .mn {
        padding: 16px
      }
    }

    @media(max-height:520px) {
      .tb {
        height: 30px
      }

      .cb span {
        height: 30px;
        width: 40px
      }

      .sd {
        padding-top: 4px
      }

      .nv {
        height: 30px;
        margin-bottom: 1px
      }

      .mn {
        padding-top: 12px;
        padding-bottom: 12px
      }

      h1 {
        font-size: 18px
      }

      .hd p {
        display: none
      }

      .gr {
        gap: 10px;
        margin-top: 12px
      }

      .cd {
        padding: 10px 12px
      }

      .v {
        font-size: 22px;
        margin: 0
      }

      .sp {
        display: none
      }

      .bars {
        height: 64px;
        margin-top: 8px
      }

      .fl {
        padding: 5px 0
      }
    }

    .gl {
      position: absolute;
      left: 0;
      top: 0;
      width: 52px;
      height: 52px;
      margin: -26px 0 0 -26px;
      opacity: 0;
      z-index: 5;
      pointer-events: none;
      will-change: transform, opacity;
      background: radial-gradient(circle, #fff 0, rgba(255, 238, 196, .85) 9%, transparent 32%), linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), transparent) center/100% 2px no-repeat, linear-gradient(0deg, transparent, rgba(255, 255, 255, .95), transparent) center/2px 100% no-repeat
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translate3d(0, 14px, 0)
      }
    }

    @keyframes grow {
      from {
        transform: scaleY(.04);
        opacity: .4
      }
    }

    @keyframes dash {
      from {
        stroke-dashoffset: 100
      }
    }

    @keyframes pill {
      from {
        transform: scaleY(.2);
        opacity: 0
      }
    }

    .gr .cd:nth-child(2) {
      animation-delay: .05s
    }

    .gr .cd:nth-child(3) {
      animation-delay: .1s
    }

    .gr .cd:nth-child(4) {
      animation-delay: .15s
    }

    .gr .cd:nth-child(5) {
      animation-delay: .2s
    }

    .cd:hover {
      background: color-mix(in srgb, var(--cd) 93%, var(--tx))
    }


    @media(display-mode:window-controls-overlay) {
      .cb {
        display: none
      }

      .tb {
        height: env(titlebar-area-height, 32px);
        padding-right: calc(100vw - env(titlebar-area-width, 100vw) - env(titlebar-area-x, 0px))
      }
    }

    @media(forced-colors:active) {

      .cd,
      .se {
        border: 1px solid CanvasText
      }

      .nv.on {
        outline: 2px solid Highlight
      }

      .band,
      #fx,
      .halo,
      .ig,
      .fill,
      #arcs,
      #cv,
      .knob::before,
      .knob::after,
      .sheen,
      .gw,
      .cor {
        display: none
      }

      .track {
        background: Canvas !important;
        border: 2px solid CanvasText !important;
        box-shadow: none !important
      }

      .knob {
        background: ButtonFace !important;
        border: 2px solid ButtonText !important;
        box-shadow: none !important
      }

      .sw:focus-visible {
        box-shadow: none;
        outline: 2px solid Highlight
      }
    }

    .band {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    #fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .dock {
      position: absolute;
      left: 0;
      top: 0;
      width: 440px;
      height: 230px;
      transform-origin: 0 0
    }

    .sw {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      padding: 0;
      margin: 0;
      background: none;
      cursor: grab;
      border-radius: 115px;
      corner-shape: squircle;
      touch-action: none;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none
    }

    .sw:focus-visible {
      box-shadow: 0 0 0 4px var(--arc)
    }

    .sw:active {
      cursor: grabbing
    }

    .track {
      position: absolute;
      inset: 0;
      border-radius: 115px;
      corner-shape: squircle;
      background: linear-gradient(180deg, color-mix(in srgb, var(--t1) 92%, white 8%), var(--t2));
      box-shadow: inset 0 3px 10px var(--tsa), inset 0 -2px 7px var(--tsb), 0 1px 0 var(--tsb), 0 14px 30px var(--drop);
      border: 1px solid rgba(255, 255, 255, .08);
      box-sizing: border-box
    }

    .halo {
      position: absolute;
      left: 0;
      top: 0;
      width: 380px;
      height: 380px;
      margin: -190px 0 0 -190px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--halo) 0%, transparent 62%);
      pointer-events: none;
      will-change: transform
    }

    .knob {
      position: absolute;
      left: 0;
      top: 15px;
      width: 200px;
      height: 200px;
      box-sizing: border-box;
      border-radius: 56px;
      corner-shape: squircle;
      transform-origin: 50% 50%;
      will-change: transform;
      isolation: isolate;
      background: radial-gradient(ellipse 72% 42% at 18% 3%, rgba(255, 255, 255, .88), transparent 72%), radial-gradient(ellipse 68% 48% at 92% 100%, var(--kref), transparent 76%), linear-gradient(150deg, rgba(255, 255, 255, .72) 0%, color-mix(in srgb, var(--k1) 97%, white 3%) 17%, var(--k1) 46%, var(--k2) 100%);
      box-shadow: inset 0 1.4px 0 rgba(255, 255, 255, .98), inset 1.2px 0 0 rgba(255, 255, 255, .62), inset -1px 0 0 rgba(255, 255, 255, .18), inset 0 -1px 0 rgba(35, 48, 75, .14), inset 0 -20px 34px rgba(20, 28, 45, .13), inset 0 0 0 1px rgba(255, 255, 255, .18), 0 1px 2px rgba(255, 255, 255, .62), 0 14px 30px var(--kd), 0 4px 9px rgba(15, 25, 45, .16), 0 0 26px var(--kouter), 0 0 64px color-mix(in srgb, var(--kouter) 55%, transparent)
    }

    .knob.settle-breath {
      animation: settle-breath 720ms cubic-bezier(.2, .75, .25, 1) 1
    }

    @keyframes settle-breath {
      0% {
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .72), inset 0 2px 3px var(--kh), inset 0 -16px 28px rgba(20, 28, 45, .075), 0 10px 22px var(--kd), 0 2px 5px rgba(15, 25, 45, .10)
      }

      35% {
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 0 0 5px rgba(155, 183, 255, .18), 0 0 34px rgba(155, 183, 255, .38), 0 12px 28px var(--kd)
      }

      100% {
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .72), inset 0 2px 3px var(--kh), inset 0 -16px 28px rgba(20, 28, 45, .075), 0 10px 22px var(--kd), 0 2px 5px rgba(15, 25, 45, .10)
      }
    }

    .knob::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 48px;
      corner-shape: squircle;
      border: 1px solid rgba(255, 255, 255, .42);
      box-shadow: inset 0 0 0 1px rgba(120, 145, 190, .08), 0 0 0 1px rgba(30, 45, 75, .035);
      pointer-events: none;
      z-index: 4
    }

    .knob .sheen {
      mix-blend-mode: screen;
      left: 9px;
      top: 7px;
      right: 31%;
      height: 40%;
      background: linear-gradient(180deg, rgba(255, 255, 255, .48), rgba(255, 255, 255, .12) 46%, rgba(255, 255, 255, 0));
      filter: blur(.35px)
    }

    .knob::before {
      opacity: .96
    }

    .knob::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(155deg, var(--kb), transparent 42%, var(--kb2));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude
    }

    .knob .gw {
      z-index: 1
    }

    .knob .gw::before {
      content: "";
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 5%;
      height: 24%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 100%, var(--kref), transparent 72%);
      filter: blur(10px);
      opacity: .9;
      pointer-events: none
    }

    .gw {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      corner-shape: squircle;
      overflow: hidden
    }

    .gw::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(125deg, rgba(255, 255, 255, .18), transparent 34%, transparent 70%, rgba(90, 115, 160, .08));
      mix-blend-mode: soft-light
    }

    .ig {
      position: absolute;
      left: 0;
      top: 0;
      width: 280px;
      height: 280px;
      margin: -140px 0 0 -140px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, color-mix(in srgb, var(--glow) 28%, transparent) 34%, transparent 68%);
      will-change: transform
    }

    .sheen {
      position: absolute;
      left: 10px;
      top: 8px;
      right: 34%;
      height: 38%;
      border-radius: 46px 46px 70px 70px;
      corner-shape: squircle;
      background: linear-gradient(180deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .06) 58%, rgba(255, 255, 255, 0));
      filter: blur(.2px);
      pointer-events: none
    }

    #cv {
      position: absolute;
      left: 0;
      top: 0;
      width: 200px;
      height: 200px;
      z-index: 2;
      filter: drop-shadow(0 2px 3px rgba(25, 35, 65, .16))
    }

    #arcs {
      position: absolute;
      left: 0;
      top: 0;
      width: 200px;
      height: 200px;
      overflow: visible;
      z-index: 3;
      pointer-events: none
    }

    #arcs path {
      fill: none;
      stroke: var(--arc);
      stroke-linecap: round
    }

    #arcs path:last-of-type {
      stroke: var(--arcw)
    }

    .knob.hit {
      animation: hit-flash 440ms ease-out 1
    }

    @keyframes hit-flash {
      0% {
        filter: brightness(1.5) saturate(1.25) drop-shadow(0 0 16px var(--arc))
      }

      100% {
        filter: brightness(1) saturate(1) drop-shadow(0 0 0 transparent)
      }
    }

    .cor {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      will-change: transform, opacity
    }

    .cor i {
      position: absolute;
      left: -190px;
      top: -190px;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(255, 205, 120, 0) 0 6deg, rgba(255, 196, 104, .5) 8deg, rgba(255, 205, 120, 0) 11deg 20deg);
      -webkit-mask: radial-gradient(circle, transparent 0 46%, #000 58%, transparent 74%);
      mask: radial-gradient(circle, transparent 0 46%, #000 58%, transparent 74%);
      animation: cor-spin 26s linear infinite
    }

    .cor b {
      position: absolute;
      left: -100px;
      top: -100px;
      width: 200px;
      height: 200px;
      animation: mote 3.4s ease-out infinite;
      background: radial-gradient(circle at 20% 80%, #fff0c8 0 1.5px, transparent 2.5px), radial-gradient(circle at 78% 70%, #ffe2a0 0 1.2px, transparent 2.2px), radial-gradient(circle at 46% 92%, #fff6dc 0 1.8px, transparent 2.8px), radial-gradient(circle at 62% 84%, #ffd890 0 1.2px, transparent 2.2px), radial-gradient(circle at 32% 60%, #fff 0 1px, transparent 2px)
    }

    @keyframes cor-spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes mote {
      0% {
        transform: translateY(14px);
        opacity: 0
      }

      25% {
        opacity: 1
      }

      100% {
        transform: translateY(-52px);
        opacity: 0
      }
    }

    .swp {
      position: absolute;
      top: -20%;
      bottom: -20%;
      left: 0;
      width: 34%;
      opacity: 0;
      pointer-events: none;
      will-change: transform;
      background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .8), rgba(255, 255, 255, 0));
      animation: swp 5.2s ease-in-out infinite
    }

    @keyframes swp {

      0%,
      55% {
        transform: translateX(-170%) skewX(-18deg)
      }

      100% {
        transform: translateX(420%) skewX(-18deg)
      }
    }

    @media(min-width:761px) {
      .sd {
        padding-top: 8px
      }

      .gr {
        gap: 12px;
        margin-top: 20px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .nv,
      .cd,
      .se,
      .cb span {
        transition: none !important
      }

      .cd,
      .bars i,
      .sp,
      .nv.on::before {
        animation: none !important
      }

      .knob,
      .halo,
      .ig {
        will-change: auto
      }

      .knob.settle-breath,
      .knob.hit,
