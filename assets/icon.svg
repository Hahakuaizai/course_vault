<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#df8a63"/>
      <stop offset="0.5" stop-color="#c96442"/>
      <stop offset="1" stop-color="#ad4d2c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f4e9db"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe0cd"/>
      <stop offset="1" stop-color="#e5d2ba"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#d97a56"/>
      <stop offset="1" stop-color="#b95430"/>
    </linearGradient>
    <filter id="ds" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#6b2d16" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#gloss)"/>

  <g filter="url(#ds)">
    <!-- 文件夹背板（含标签页） -->
    <path d="M104 178a38 38 0 0 1 38-38h74a26 26 0 0 1 20.8 10.4L256 176h114a38 38 0 0 1 38 38v150a38 38 0 0 1-38 38H142a38 38 0 0 1-38-38V178z"
          fill="url(#tab)"/>

    <!-- 文件夹前板（略微下沉，形成层次） -->
    <path d="M104 232a38 38 0 0 1 38-38h228a38 38 0 0 1 38 38v132a38 38 0 0 1-38 38H142a38 38 0 0 1-38-38V232z"
          fill="url(#folder)"/>

    <!-- 五角星（居中偏上，四周留足边距） -->
    <path d="M256 262l18.4 37.3 41.2 6-29.8 29.1 7 41-36.8-19.4-36.8 19.4 7-41-29.8-29.1 41.2-6z"
          fill="url(#star)"/>
  </g>
</svg>